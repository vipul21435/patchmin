[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchmin"
version = "0.1.0"
description = "Find the part of a fix that actually fixes it: delta debugging over patch hunks against a test command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
patchmin = "patchmin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
